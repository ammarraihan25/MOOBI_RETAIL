version: '3.8'

services:
  moobi-frontend:
    build:
      context: ./moobi-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - moobi-backend

  moobi-backend:
    build:
      context: ./moobi-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=moobi-db
      - DB_PORT=5432
      - DB_DATABASE=moobi_retail
      - DB_USERNAME=moobi_user
      - DB_PASSWORD=moobi_secure_pass
      - REDIS_HOST=moobi-redis
    depends_on:
      - moobi-db
      - moobi-redis

  moobi-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: moobi_retail
      POSTGRES_USER: moobi_user
      POSTGRES_PASSWORD: moobi_secure_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  moobi-redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
